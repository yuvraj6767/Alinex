<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Portrait container */
    .pdf-container {
      width: 100%;
      max-width: 420px;   /* mobile portrait width */
      height: 95vh;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 10px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tablet/Desktop adjustment */
    @media (min-width: 768px) {
      .pdf-container {
        max-width: 600px;
      }
    }
  </style>
</head>

<body>

  <div class="pdf-container">
    <iframe src="PORTFOLIO.pdf"></iframe>
  </div>

</body>
</html>
